name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.CLIPBEAK_KEYSTORE_BASE64 != '' }}
      EXPECTED_SIGNER: ${{ vars.CLIPBEAK_CERT_SHA256 }}
    steps:
      - name: Check signing setup
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::Configure ClipBeak signing before publishing APKs."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag commit is on main
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: env.HAS_KEYSTORE == 'true'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: env.HAS_KEYSTORE == 'true'

      - name: Build with the ClipBeak signing certificate
        if: env.HAS_KEYSTORE == 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.CLIPBEAK_KEYSTORE_BASE64 }}
          CLIPBEAK_STORE_PASSWORD: ${{ secrets.CLIPBEAK_STORE_PASSWORD }}
          CLIPBEAK_KEYSTORE_PATH: ${{ runner.temp }}/clipbeak.p12
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f -- "$CLIPBEAK_KEYSTORE_PATH"' EXIT
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$CLIPBEAK_KEYSTORE_PATH"
          unset ENCODED_KEYSTORE
          test "$(scripts/signing-fingerprint.sh)" = "$EXPECTED_SIGNER"
          bash gradlew --no-daemon --no-configuration-cache assembleGenericRelease

      - name: Verify release APKs
        if: env.HAS_KEYSTORE == 'true'
        run: |
          scripts/verify-release-apks.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/verified-apks"

      - name: Prepare draft release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ runner.temp }}/verified-apks/*.apk
            LICENSE
            NOTICE.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            **Download for Android (Recommended — most phones):** [ClipBeak-${{ github.ref_name }}-generic-arm64-v8a-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ClipBeak-${{ github.ref_name }}-generic-arm64-v8a-release.apk)

            **Not sure which one? Download Universal APK (works on any Android):** [ClipBeak-${{ github.ref_name }}-generic-universal-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ClipBeak-${{ github.ref_name }}-generic-universal-release.apk)

            ClipBeak is the new name of Nexo, gabrieldave's Android app based on Seal by JunkFood02 and contributors. Licensed under GPLv3.
            [App source](https://github.com/${{ github.repository }}/tree/${{ github.sha }}) · [FFmpeg and aria2 source details](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/NOTICE.md#ffmpeg-and-aria2-sources).
            Choose arm64-v8a for most phones. This version installs alongside the Nexo alphas.
