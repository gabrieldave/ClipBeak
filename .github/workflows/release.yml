name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.CLIPBEAK_KEYSTORE_BASE64 != '' }}
      EXPECTED_SIGNER: ${{ vars.CLIPBEAK_CERT_SHA256 }}
    steps:
      - name: Check signing setup
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::Configure ClipBeak signing before publishing APKs."

      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'

      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: android-actions/setup-android@v4
        if: env.HAS_KEYSTORE == 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEYSTORE == 'true'

      - name: Build with the ClipBeak signing certificate
        if: env.HAS_KEYSTORE == 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.CLIPBEAK_KEYSTORE_BASE64 }}
          CLIPBEAK_STORE_PASSWORD: ${{ secrets.CLIPBEAK_STORE_PASSWORD }}
          CLIPBEAK_KEYSTORE_PATH: ${{ runner.temp }}/clipbeak.p12
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f -- "$CLIPBEAK_KEYSTORE_PATH"' EXIT
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$CLIPBEAK_KEYSTORE_PATH"
          unset ENCODED_KEYSTORE
          test "$(scripts/signing-fingerprint.sh)" = "$EXPECTED_SIGNER"
          bash gradlew --no-daemon --no-configuration-cache assembleGenericRelease

      - name: Verify release APKs
        if: env.HAS_KEYSTORE == 'true'
        run: |
          scripts/verify-release-apks.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/verified-apks"

      - name: Prepare draft release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/verified-apks/*.apk
            LICENSE
            NOTICE.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            ClipBeak is the new name of Nexo, gabrieldave's Android app based on Seal by JunkFood02 and contributors. Licensed under GPLv3.
            [App source](https://github.com/${{ github.repository }}/tree/${{ github.sha }}) · [FFmpeg and aria2 source details](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/NOTICE.md#ffmpeg-and-aria2-sources).
            Choose arm64-v8a for most phones. This version installs alongside the Nexo alphas.
