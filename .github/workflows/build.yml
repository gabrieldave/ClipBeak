# Nexo: compila en cada push y pull request, también en forks.
# No usa ningún secreto: genera un APK de depuración firmado con la llave de depuración
# automática de Gradle, útil para probar pero no para distribuir.
name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuración
        run: |
          chmod +x gradlew
          ./gradlew assembleGenericDebug

      - name: Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: nexo-debug-apk
          path: app/build/outputs/apk/generic/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
